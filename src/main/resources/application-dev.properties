# 开发环境配置

# 服务器配置
server.port=8080

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/ticket_12306?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.ticket.system.entity

# Redis配置
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

# RabbitMQ配置
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==================== Spring AI 配置 ====================
# OpenAI API Key (请替换为你的实际API Key)
spring.ai.openai.api-key=your-openai-api-key-here

# OpenAI Base URL (使用代理或直连)
spring.ai.openai.base-url=https://api.openai.com

# Chat 模型
spring.ai.openai.chat.model=gpt-3.5-turbo

# 代理配置 (可选)
# spring.ai.openai.proxy.host=127.0.0.1
# spring.ai.openai.proxy.port=7890

# 日志级别
logging.level.com.ticket.system=DEBUG
logging.level.org.springframework.ai=DEBUG
