server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    accept-count: 100

spring:
  devtools:
    restart:
      enabled: false


  mvc:
    path match:
      matching-strategy: ant_path_matcher

  application:
    name: ticket-system

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.171.134:3306/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis配置

  # RabbitMQ配置
  rabbitmq:
    host: 192.168.171.134
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 10

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  data:
    redis:
      host: 192.168.171.134
      port: 6379
      database: 0
      timeout: 3000ms
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max-latest

# Mybatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ticket.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true

# 日志配置
logging:
  level:
    com.ticket.system: debug
    org.springframework.web: info
    org.mybatis: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/ticket-system.log
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 30

# JWT配置
jwt:
  secret: ticket-12306-system-secret-key-2024-springboot-mybatis-jwt-redis
  expire: 86400000  # 24小时
  header: Authorization

# 订单配置
order:
  expire-time: 1800000  # 30分钟订单过期时间
  auto-cancel-cron: "0 */5 * * * ?"  # 每5分钟检查一次过期订单

# Redis向量搜索配置
  vector:
    store:
      redis:
        host: 192.168.171.134
        port: 6379
        database: 0

# 知识库配置
ticket:
  knowledge:
    base-path: data/knowledge  # 知识文档存储路径
    chunk-size: 500  # 文本分块大小（token估算，中文1字≈1token，英文1词≈0.5token）
    chunk-overlap: 50  # 块重叠大小（token估算，优先按句子边界衔接）
